# Rime dictionary
# encoding: utf-8
# 个人词库（独立词库，由 user/rime_ice.custom.yaml 挂载为独立翻译器）：
# 候选权重统一高于主拼音词库、低于置顶短语，因此个人词永远排在普通词前面。
#
# 词条格式（Tab 分隔）：词语<Tab>拼音编码<Tab>词频权重
#   - 编码用全拼、音节之间用空格分隔；多音字按实际读音注音，如「重庆」→ chong qing
#   - 权重越大越靠前（同一编码下词条之间按权重排序）
#   - 快捷添加：python3 tools/add_words.py "词语" [权重] [拼音]
#
# 注意：本文件由 tools/add_words.py 管理时，会把词条按权重从高到低重新排序；
# 手工编辑同样有效，运行脚本后顺序会被整理。
